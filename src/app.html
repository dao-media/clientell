<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;500&display=swap"
			rel="stylesheet"
		/>
		<script>
			try {
				const key = 'briefly-theme';
				const stored = localStorage.getItem(key);
				const setting =
					stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
				const theme =
					setting === 'light'
						? 'light'
						: setting === 'dark'
							? 'dark'
							: window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
				document.documentElement.setAttribute('data-theme', theme);
			} catch {
				document.documentElement.setAttribute('data-theme', 'light');
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap" data-sveltekit-preload-code="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

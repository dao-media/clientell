<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;500&display=swap"
			rel="stylesheet"
		/>
		<script>
			try {
				const key = 'briefly-theme';
				const stored = localStorage.getItem(key);
				const setting =
					stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
				const theme =
					setting === 'light'
						? 'light'
						: setting === 'dark'
							? 'dark'
							: window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
				document.documentElement.setAttribute('data-theme', theme);
			} catch {
				// Storage blocked: still follow the system setting rather than forcing light.
				document.documentElement.setAttribute(
					'data-theme',
					window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
				);
			}
		</script>
		<script>
			// Arriving from the portfolio through its wave transition (?wave=1): start solid ink, so the
			// page never shows before the lines sweep it in ($lib/wave-transition.ts).
			if (/[?&]wave=1/.test(location.search) && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
				document.documentElement.classList.add('wave-arrive');
			}
		</script>
		<style>
			html.wave-arrive::after {
				content: '';
				position: fixed;
				inset: 0;
				z-index: 2147483646;
				background: #241e1c;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap" data-sveltekit-preload-code="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
